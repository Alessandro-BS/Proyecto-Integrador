# ============================================================
# SISOL SALUD - Configuración Principal
# ============================================================

spring:
  application:
    name: sisol-salud

  # ---- Inicialización de SQL ----
  sql:
    init:
      mode: always

  # ---- Base de Datos H2 (En memoria) ----
  datasource:
    url: jdbc:h2:mem:sisoldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # ---- JPA / Hibernate ----
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # ---- Thymeleaf ----
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # ---- Email (SMTP) - Usaremos Mailtrap para pruebas locales ----
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:a_configurar}
    password: ${MAIL_PASSWORD:a_configurar}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ---- DevTools ----
  devtools:
    restart:
      enabled: true

# ---- Seguridad JWT ----
app:
  jwt:
    secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraParaSisolSaludQueDebeSerMuyLargaParaHS512AlMenos64Bytes!}
    expiration-ms: 86400000  # 24 horas

# ---- Notificaciones ----
  mail:
    from: ${MAIL_FROM:noreply@sisolsalud.pe}
    nombre-sistema: SISOL Salud

# ---- Servidor ----
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,beans,env"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ---- Información del Sistema (para endpoint /info) ----
info:
  app:
    name: SISOL Salud - Backend
    description: Sistema Inteligente de Turnos para Hospitales SISOL
    version: 1.0.0
    status: Desarrollo - Fase 9
  company: SISOL Salud Peru

# ---- Swagger / OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ---- Logging ----
logging:
  level:
    com.sisol.salud: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG


