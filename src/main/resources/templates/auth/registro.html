<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Crear Cuenta</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3 mt-3">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus display-4 text-primary"></i>
                            <h2 class="mt-3 font-weight-bold">Crear Cuenta</h2>
                            <p class="text-muted">Únete a SISOL Salud y gestiona tus citas fácilmente</p>
                        </div>

                        <form id="registroForm" th:action="@{/api/auth/register}" method="post">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6 form-floating">
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" required>
                                    <label for="nombre" class="ms-2">Nombre</label>
                                </div>
                                <div class="col-md-6 form-floating">
                                    <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellido" required>
                                    <label for="apellido" class="ms-2">Apellido</label>
                                </div>
                            </div>
                            
                            <div class="row g-3 mb-3">
                                <div class="col-md-6 form-floating">
                                    <input type="text" class="form-control" id="dni" name="dni" placeholder="DNI" required pattern="\d{8}">
                                    <label for="dni" class="ms-2">DNI (8 dígitos)</label>
                                </div>
                                <div class="col-md-6 form-floating">
                                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono">
                                    <label for="telefono" class="ms-2">Teléfono</label>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
                                <label for="email">Correo Electrónico</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                                <label for="password">Contraseña</label>
                            </div>
                            
                            <!-- Campos adicionales del Paciente -->
                            <hr class="my-4">
                            <h5 class="mb-3 text-muted">Datos Adicionales</h5>
                            
                            <div class="row g-3 mb-4">
                                <div class="col-md-6 form-floating">
                                    <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
                                    <label for="fechaNacimiento" class="ms-2">Fecha de Nacimiento</label>
                                </div>
                                <div class="col-md-6 form-floating">
                                    <select class="form-select" id="grupoSanguineo" name="grupoSanguineo">
                                        <option value="">Seleccione...</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                    <label for="grupoSanguineo" class="ms-2">Grupo Sanguíneo</label>
                                </div>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Dirección">
                                <label for="direccion">Dirección</label>
                            </div>
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Completar Registro</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="mb-0">¿Ya tienes una cuenta? <a th:href="@{/auth/login}" class="text-decoration-none fw-bold">Inicia Sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
