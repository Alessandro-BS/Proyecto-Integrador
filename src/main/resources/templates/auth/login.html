<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Iniciar Sesión</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-3 mt-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle display-4 text-primary"></i>
                            <h2 class="mt-3 font-weight-bold">Iniciar Sesión</h2>
                            <p class="text-muted">Accede a tu cuenta de SISOL Salud</p>
                        </div>

                        <!-- El formulario será manejado vía AJAX (JS) o Form Submission -->
                        <form id="loginForm" th:action="@{/api/auth/login}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="dni" name="dni" placeholder="12345678" required>
                                <label for="dni">Número de DNI</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                                <label for="password">Contraseña</label>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="mb-0">¿No tienes una cuenta? <a th:href="@{/auth/registro}" class="text-decoration-none fw-bold">Regístrate aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
