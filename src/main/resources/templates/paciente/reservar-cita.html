<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Reservar Cita</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0"><i class="bi bi-calendar-plus me-2"></i>Agendar Nueva Cita</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Stepper / Progreso visual -->
                        <div class="position-relative mb-5">
                            <div class="progress" style="height: 2px;">
                                <div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <button type="button" class="position-absolute top-0 start-0 translate-middle btn btn-sm btn-primary rounded-pill" style="width: 2rem; height:2rem;">1</button>
                            <button type="button" class="position-absolute top-0 start-50 translate-middle btn btn-sm btn-secondary rounded-pill" style="width: 2rem; height:2rem;">2</button>
                            <button type="button" class="position-absolute top-0 start-100 translate-middle btn btn-sm btn-secondary rounded-pill" style="width: 2rem; height:2rem;">3</button>
                        </div>
                        
                        <p class="text-muted mb-4">Paso 1: Seleccione la especialidad y el médico que desea consultar.</p>

                        <form th:action="@{/paciente/reservar-cita}" method="post">
                            <div class="mb-4">
                                <label for="especialidad" class="form-label fw-bold">Especialidad Requerida</label>
                                <select class="form-select form-select-lg" id="especialidad" name="especialidad" required>
                                    <option value="" selected disabled>Seleccione una especialidad...</option>
                                    <option value="1">Cardiología</option>
                                    <option value="2">Dermatología</option>
                                    <option value="3">Pediatría</option>
                                    <!-- Aquí se cargarán dinámicamente -->
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="medico" class="form-label fw-bold">Especialista (Opcional)</label>
                                <select class="form-select form-select-lg" id="medico" name="medico">
                                    <option value="" selected disabled>Seleccione primero una especialidad</option>
                                    <!-- Aquí se cargarán dinámicamente -->
                                </select>
                                <div class="form-text">Si no tiene preferencia, le asignaremos el médico con mayor disponibilidad.</div>
                            </div>

                            <div class="d-flex justify-content-between mt-5">
                                <a th:href="@{/paciente/dashboard}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="button" class="btn btn-primary px-4">Siguiente Paso <i class="bi bi-arrow-right ms-2"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
