<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Mis Citas</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Mis Citas</h2>
                <p class="text-muted">Historial de tus atenciones y citas programadas.</p>
            </div>
            <a th:href="@{/paciente/reservar-cita}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Nueva Cita
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Especialidad</th>
                                <th>Médico</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Ejemplo de fila estática (luego será dinámica con th:each) -->
                            <tr>
                                <td>15/06/2026</td>
                                <td>10:00 AM</td>
                                <td>Cardiología</td>
                                <td>Dr. Juan Pérez</td>
                                <td><span class="badge bg-warning text-dark">Pendiente</span></td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-danger" title="Cancelar Cita">
                                        <i class="bi bi-x-circle"></i> Cancelar
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>10/05/2026</td>
                                <td>03:30 PM</td>
                                <td>Dermatología</td>
                                <td>Dra. Ana Gómez</td>
                                <td><span class="badge bg-success">Completada</span></td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-secondary" title="Ver Detalles" disabled>
                                        <i class="bi bi-eye"></i> Detalles
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
