<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin_base}">
<head>
    <title>Gestión de Médicos</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h2 class="fw-bold" style="color: #0f172a;"><i class="bi bi-people-fill text-primary me-2"></i>Gestión de Médicos</h2>
                <p class="text-muted">Administración del personal médico de la clínica.</p>
            </div>
            <div class="col-md-6 text-md-end">
                <a th:href="@{/admin/medicos/nuevo}" class="btn text-white shadow-sm px-4 py-2" style="background-color: var(--primary); border-radius: 8px;">
                    <i class="bi bi-plus-circle me-2"></i> Registrar Médico
                </a>
            </div>
        </div>

        <div class="card card-soft">
            <div class="card-header bg-white border-0 pt-3 pb-0">
                <form th:action="@{/admin/medicos}" method="get" class="row g-3 align-items-center">
                    <div class="col-md-8 col-lg-5">
                        <div class="input-group shadow-sm" style="border-radius: 8px; overflow: hidden;">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" name="search" th:value="${search}" placeholder="Buscar por nombre, CMP o especialidad..." style="box-shadow: none;">
                        </div>
                    </div>
                    <div class="col-md-4 col-lg-2">
                        <button type="submit" class="btn text-white w-100 shadow-sm" style="background-color: var(--primary-container); border-radius: 8px;">Filtrar</button>
                    </div>
                </form>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" style="min-width: 1000px;">
                        <thead style="background-color: #f8fafc; color: #475569; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">
                            <tr>
                                <th class="py-3 px-4 border-0">Médico</th>
                                <th class="py-3 border-0">Especialidad</th>
                                <th class="py-3 border-0">CMP</th>
                                <th class="py-3 border-0">Contacto</th>
                                <th class="py-3 border-0 text-center">Estado</th>
                                <th class="py-3 px-4 border-0 text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="border-top-0">
                            <tr th:each="medico : ${medicos}" class="border-bottom" style="transition: background-color 0.2s;">
                                <td class="px-4 py-3">
                                    <div class="d-flex align-items-center">
                                        <img th:if="${medico.usuario.fotoPerfil != null}" th:src="${medico.usuario.fotoPerfil}" class="rounded-circle me-3 shadow-sm border border-2 border-white" width="48" height="48" style="object-fit: cover;">
                                        <div th:unless="${medico.usuario.fotoPerfil != null}" class="rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm border border-2 border-white" style="width: 48px; height: 48px; font-weight: bold; font-size: 1.1rem; background-color: var(--primary); color: white;">
                                            <span th:text="${#strings.substring(medico.usuario.nombre,0,1) + #strings.substring(medico.usuario.apellido,0,1)}"></span>
                                        </div>
                                        <div>
                                            <div class="fw-bold mb-1" style="color: #1e293b;" th:text="${'Dr. ' + medico.usuario.nombre + ' ' + medico.usuario.apellido}">Nombre</div>
                                            <small class="text-muted d-block"><i class="bi bi-person-vcard me-1"></i> <span th:text="${medico.usuario.dni}">DNI</span></small>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-3">
                                    <span th:each="esp : ${medico.especialidades}" class="badge rounded-pill me-1 mb-1 fw-medium" style="background-color: #eff6ff; color: #1d4ed8; padding: 0.5em 0.8em; border: 1px solid #bfdbfe;" th:text="${esp.nombre}">Esp</span>
                                </td>
                                <td class="py-3 text-muted fw-medium" th:text="${medico.numeroColegiatura}">CMP</td>
                                <td class="py-3">
                                    <div class="text-dark mb-1" style="font-size: 0.9rem;"><i class="bi bi-envelope text-muted me-1"></i> <span th:text="${medico.usuario.email}">Email</span></div>
                                    <small class="text-muted"><i class="bi bi-telephone text-muted me-1"></i> <span th:text="${medico.usuario.telefono}">Teléfono</span></small>
                                </td>
                                <td class="py-3 text-center">
                                    <span th:if="${medico.usuario.activo}" class="badge rounded-pill" style="background-color: #dcfce7; color: #166534; padding: 0.4em 0.8em;"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem; vertical-align: middle;"></i>Activo</span>
                                    <span th:unless="${medico.usuario.activo}" class="badge rounded-pill" style="background-color: #fee2e2; color: #991b1b; padding: 0.4em 0.8em;"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem; vertical-align: middle;"></i>Inactivo</span>
                                </td>
                                <td class="px-4 py-3 text-end">
                                    <a th:href="@{/admin/medicos/editar/{id}(id=${medico.id})}" class="btn btn-sm btn-light rounded-circle shadow-sm me-1" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; color: #475569;" title="Editar Médico">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/admin/medicos/toggle-status/{id}(id=${medico.id})}" th:class="${medico.usuario.activo ? 'btn btn-sm btn-light rounded-circle shadow-sm text-danger' : 'btn btn-sm btn-light rounded-circle shadow-sm text-success'}" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;" th:title="${medico.usuario.activo ? 'Desactivar' : 'Activar'}" onclick="return confirm('¿Cambiar estado del médico?')">
                                        <i th:class="${medico.usuario.activo ? 'bi bi-person-x-fill' : 'bi bi-person-check-fill'}"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${medicos.isEmpty()}">
                                <td colspan="6" class="text-center py-5">
                                    <div class="text-muted mb-2"><i class="bi bi-inbox fs-1"></i></div>
                                    <h5>No se encontraron médicos.</h5>
                                    <p class="text-muted small">Intenta con otros términos de búsqueda o registra uno nuevo.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
