<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-hospital me-2"></i>SISOL Salud
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/medicos}">Nuestros Médicos</a>
                    </li>
                </ul>
                <div class="d-flex" sec:authorize="!isAuthenticated()">
                    <!-- Opciones para usuarios NO autenticados -->
                    <a th:href="@{/auth/login}" class="btn btn-outline-primary me-2">Iniciar Sesión</a>
                    <a th:href="@{/auth/registro}" class="btn btn-primary">Registrarse</a>
                </div>
                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <!-- Opciones para usuarios autenticados -->
                    <span class="me-3 fw-bold text-primary">
                        <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name">Usuario</span>
                    </span>
                    <a th:href="@{/auth/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
