<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-hospital me-2"></i>SISOL Salud
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-bold">
                    <li class="nav-item px-2">
                        <a class="nav-link text-uppercase" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-uppercase" th:href="@{/nosotros}">Nosotros</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-uppercase" th:href="@{/medicos}">Médicos</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-uppercase" th:href="@{/servicios}">Servicios</a>
                    </li>
                </ul>
                <div class="d-flex" sec:authorize="!isAuthenticated()">
                    <!-- Opciones para usuarios NO autenticados -->
                    <a th:href="@{/auth/login}" class="btn btn-primary btn-reservar px-4 fw-bold rounded-1">RESERVAR CITA</a>
                </div>
                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <!-- Opciones para usuarios autenticados -->

                    <a th:href="@{/paciente/dashboard}" class="btn btn-outline-primary btn-sm me-2 fw-bold">Mi Perfil</a>
                    <a th:href="@{/auth/logout}" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
