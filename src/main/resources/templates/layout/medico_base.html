<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - SISOL Salud Médico' : 'SISOL Salud Médico'}">SISOL Salud Médico
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts (Manrope & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #4b0004;
            --primary-container: #6b1515;
            --surface: #fff8f7;
            /* Soft cream background */
            --pure-white: #ffffff;
            --text-main: #333333;
            --text-muted: #564240;
            --outline: #ddc0bd;

            --font-headline: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            background-color: var(--surface);
            font-family: var(--font-body);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .medico-sidebar {
            width: 280px;
            background-color: var(--primary);
            color: var(--pure-white);
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .medico-brand {
            padding: 2rem 1.5rem 0.5rem 1.5rem;
            font-family: var(--font-headline);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .medico-brand-subtitle {
            padding: 0 1.5rem;
            font-family: var(--font-headline);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffb3ad;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .medico-nav {
            flex-grow: 1;
            padding: 0;
        }

        .medico-nav-item {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 0.25rem 1rem;
            border-radius: 0.5rem;
        }

        .medico-nav-item:hover,
        .medico-nav-item.active {
            background-color: var(--primary-container);
            color: var(--pure-white);
        }

        .medico-nav-item i {
            width: 20px;
            text-align: center;
        }

        .medico-profile-container {
            background-color: #6b1515;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: auto;
        }

        .medico-profile-widget {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .medico-profile-widget img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .medico-profile-info {
            display: flex;
            flex-direction: column;
        }

        .medico-profile-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .medico-profile-role {
            font-size: 0.8rem;
            color: #ffb3ad;
        }

        .btn-logout {
            background-color: #550a0a;
            color: var(--pure-white);
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #410003;
            color: var(--pure-white);
        }

        /* Main Content Wrapper */
        .medico-content {
            margin-left: 280px;
            flex-grow: 1;
            padding: 2rem 3rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .medico-content-inner {
            flex-grow: 1;
        }

        .medico-footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #E5E5E5;
            display: flex;
            justify-content: space-between;
            color: #676462;
            font-size: 0.85rem;
        }

        .medico-footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .medico-footer a {
            color: #676462;
            text-decoration: none;
        }

        .medico-footer a:hover {
            color: var(--primary);
        }

        /* Utilities */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .headline {
            font-family: var(--font-headline);
            font-weight: 700;
        }

        .card-soft {
            background-color: var(--pure-white);
            border-radius: 1rem;
            border: none;
            box-shadow: 0 4px 20px rgba(107, 21, 21, 0.04);
            padding: 1.5rem;
        }

        .btn-maroon {
            background-color: var(--primary);
            color: var(--pure-white);
            border-radius: 9999px;
            /* Pill */
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border: none;
            transition: all 0.2s;
        }

        .btn-maroon:hover {
            background-color: #380003;
            color: var(--pure-white);
            transform: translateY(-2px);
        }

        .btn-white {
            background-color: var(--pure-white);
            color: var(--text-main);
            border-radius: 9999px;
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            border: 1px solid #eee;
            transition: all 0.2s;
        }

        .btn-white:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <nav class="medico-sidebar">
        <div class="medico-brand">
            SISOL Salud
        </div>
        <div class="medico-brand-subtitle">
            Portal Médico
        </div>

        <div class="medico-nav">
            <a th:href="@{/panel-medico/dashboard}"
                th:classappend="${title != null and title.contains('Panel')} ? 'active' : ''" class="medico-nav-item">
                <i class="fa-solid fa-table-cells-large"></i> Panel Principal
            </a>
            <a th:href="@{/panel-medico/citas-hoy}"
                th:classappend="${title != null and title.contains('Citas')} ? 'active' : ''" class="medico-nav-item">
                <i class="fa-regular fa-calendar"></i> Mi Agenda
            </a>
            <a th:href="@{/panel-medico/disponibilidad}"
                th:classappend="${title != null and title.contains('Disponibilidad')} ? 'active' : ''"
                class="medico-nav-item">
                <i class="fa-regular fa-user"></i> Mi Disponibilidad
            </a>
        </div>

        <div class="medico-profile-container">
            <div class="medico-profile-widget">
                <img th:if="${usuario != null && usuario.fotoPerfil != null}" th:src="${usuario.fotoPerfil}" alt="Doctor Profile">
                <img th:unless="${usuario != null && usuario.fotoPerfil != null}" th:src="${usuario != null} ? 'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '+' + ${usuario.apellido} + '&background=ffffff&color=4b0004' : 'https://ui-avatars.com/api/?name=Medico&background=ffffff&color=4b0004'" alt="Doctor Profile">
                <div class="medico-profile-info">
                    <span class="medico-profile-name" th:text="${usuario != null ? 'Dr(a). ' + usuario.nombre + ' ' + usuario.apellido : 'Dr. Médico'}">Dr. Ricardo M.</span>
                    <span class="medico-profile-role" th:text="${medico != null && medico.especialidades != null && !medico.especialidades.isEmpty() ? medico.especialidades.iterator().next().nombre : 'Especialista'}">Cardiólogo</span>
                </div>
            </div>
            <a href="#" class="btn-logout" data-bs-toggle="modal" data-bs-target="#logoutModal">
                <i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="medico-content">
        <!-- Contenido dinámico -->
        <div class="medico-content-inner" layout:fragment="content"></div>

        <footer class="medico-footer">
            <div>&copy; 2026 SISOL Salud. Sistema Interno de Gestión de Citas.</div>
            <div class="medico-footer-links">
                <a href="#">Soporte Técnico</a>
                <a href="#">Política de Privacidad</a>
            </div>
        </footer>
    </main>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="border-radius: 1rem; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title headline" id="logoutModalLabel" style="color: #4b0004;">Confirmar Cierre de
                        Sesión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                    ¿Estás seguro que deseas cerrar tu sesión?
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal"
                        style="border-radius: 8px; font-weight: 600;">Cancelar</button>
                    <a th:href="@{/auth/logout}" class="btn btn-danger"
                        style="background-color: #ba1a1a; border: none; border-radius: 8px; font-weight: 600;">Sí,
                        cerrar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
