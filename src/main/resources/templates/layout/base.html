<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">SISOL Salud</title>
    
    <!-- Bootstrap 5 CSS via WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    
    <!-- Google Fonts (Manrope and Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos Personalizados (Media Queries) -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Incluir el fragmento de la barra de navegación -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Contenedor Principal donde se inyectarán las demás páginas -->
    <main class="container my-5">
        <!-- Alertas globales (mensajes de éxito o error) -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        
        <!-- El contenido dinámico de cada página irá aquí -->
        <div layout:fragment="content">
            <!-- Contenido por defecto -->
        </div>
    </main>

    <!-- Incluir el fragmento del footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS via WebJars -->
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    
    <!-- Bloque para scripts adicionales de cada página (ej: Chart.js) -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
