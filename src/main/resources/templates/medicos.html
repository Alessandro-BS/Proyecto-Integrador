<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Nuestros Médicos</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Nuestros Especialistas</h1>
            <p class="lead text-muted">Conoce al equipo médico altamente calificado que conforma SISOL Salud.</p>
        </div>

        <!-- Filtros de Búsqueda -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body bg-light rounded">
                <form th:action="@{/medicos}" method="get" class="row g-3">
                    <div class="col-md-5">
                        <label for="keyword" class="form-label fw-bold">Nombre o Apellido</label>
                        <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}" placeholder="Buscar médico...">
                    </div>
                    <div class="col-md-5">
                        <label for="especialidadId" class="form-label fw-bold">Especialidad</label>
                        <select class="form-select" id="especialidadId" name="especialidadId">
                            <option value="">Todas las especialidades</option>
                            <option th:each="esp : ${especialidades}" 
                                    th:value="${esp.id}" 
                                    th:text="${esp.nombre}"
                                    th:selected="${esp.id == especialidadId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search me-2"></i>Buscar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Iterar sobre la lista de médicos -->
            <div class="col" th:each="medico : ${medicos}">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">
                        <!-- Icono temporal de médico -->
                        <div class="mb-3">
                            <i class="bi bi-person-badge display-3 text-secondary"></i>
                        </div>
                        <h4 class="card-title fw-bold" th:text="'Dr. ' + ${medico.nombre} + ' ' + ${medico.apellido}">Dr. Juan Pérez</h4>
                        <h6 class="card-subtitle mb-3 text-primary fw-bold" th:text="${medico.especialidad}">Cardiología</h6>
                        <p class="card-text text-muted small">CMP: <span th:text="${medico.cpm}">123456</span></p>
                    </div>
                    <div class="card-footer bg-white border-0 text-center pb-4">
                        <a th:href="@{/auth/login}" class="btn btn-outline-primary btn-sm">Agendar Cita</a>
                    </div>
                </div>
            </div>
            
            <!-- Mensaje si no hay médicos -->
            <div class="col-12" th:if="${#lists.isEmpty(medicos)}">
                <div class="alert alert-info text-center" role="alert">
                    <i class="bi bi-info-circle me-2"></i> No hay médicos registrados en el sistema en este momento.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
