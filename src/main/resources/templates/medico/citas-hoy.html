<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/medico_base}">

<head>
    <title>Mis Citas de Hoy</title>
    <style>
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .schedule-title {
            font-size: 2rem;
            margin-bottom: 0.25rem;
            color: #141d23;
        }

        .schedule-date {
            color: #676462;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .schedule-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: #564240;
            position: relative;
            cursor: pointer;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .view-toggle {
            background-color: var(--pure-white);
            border-radius: 8px;
            display: inline-flex;
            overflow: hidden;
            border: 1px solid #E5E5E5;
        }

        .view-btn {
            padding: 0.5rem 1.5rem;
            background: none;
            border: none;
            font-weight: 600;
            color: #676462;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .view-btn.active {
            background-color: var(--primary);
            color: var(--pure-white);
        }

        .date-navigator {
            background-color: var(--pure-white);
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            padding: 0.25rem;
        }

        .date-nav-btn {
            background: none;
            border: none;
            padding: 0.25rem 0.75rem;
            color: #141d23;
            font-weight: bold;
            cursor: pointer;
        }

        .date-label {
            padding: 0 1rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: #141d23;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        
        <!-- Header -->
        <div class="schedule-header">
            <div>
                <h1 class="schedule-title headline" th:text="'Buenos días, Dr(a). ' + ${usuario != null ? usuario.apellido : 'Mendoza'}">Buenos días, Dr. Ricardo</h1>
                <p class="schedule-date">
                    <i class="fa-regular fa-calendar"></i> 
                    <span th:text="${#temporals.format(fechaActual, 'EEEE, dd ''de'' MMMM yyyy')}">Lunes, 24 de Junio 2024</span>
                </p>
            </div>
            <div class="schedule-actions">
                <button class="icon-btn">
                    <i class="fa-regular fa-bell"></i>
                </button>
                <button class="btn-maroon ms-3">
                    <i class="fa-solid fa-calendar-plus me-2"></i> Añadir Bloqueo
                </button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="view-toggle">
                <button class="view-btn active">Día</button>
                <a th:href="@{/panel-medico/citas-hoy}" class="view-btn text-decoration-none">Ir a Hoy</a>
            </div>
            
            <div class="date-navigator">
                <a th:href="@{/panel-medico/citas-hoy(fecha=${fechaAnterior})}" class="date-nav-btn text-decoration-none"><i class="fa-solid fa-chevron-left"></i></a>
                <span class="date-label" th:text="${#temporals.format(fechaActual, 'dd MMM yyyy')}">Junio 24</span>
                <a th:href="@{/panel-medico/citas-hoy(fecha=${fechaSiguiente})}" class="date-nav-btn text-decoration-none"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>

        <!-- Citas List -->
        <div class="mt-4">
            <div th:if="${#lists.isEmpty(citasHoy)}" class="alert alert-info text-center" style="background-color: #f8f9fa; border: 1px dashed #ced4da; padding: 3rem;">
                <i class="fa-regular fa-calendar-check" style="font-size: 3rem; color: #adb5bd; margin-bottom: 1rem; display: block;"></i>
                <h4 class="text-muted">No tienes citas programadas para esta fecha</h4>
                <p class="text-muted mb-0">Disfruta tu día o selecciona otra fecha para ver tu agenda.</p>
            </div>

            <div class="row gx-4">
                <div th:each="cita : ${citasHoy}" class="col-md-6 mb-4">
                    <div class="card shadow-sm h-100" style="border-radius: 12px; border: none; border-left: 5px solid var(--primary);">
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <span class="badge bg-light text-dark mb-2 border" style="font-size: 0.8rem;">
                                        <i class="fa-regular fa-clock me-1"></i>
                                        <span th:text="${#temporals.format(cita.horaInicio, 'hh:mm a')}"></span> - 
                                        <span th:text="${#temporals.format(cita.horaFin, 'hh:mm a')}"></span>
                                    </span>
                                    <h5 class="card-title fw-bold mb-1" th:text="${cita.paciente.usuario.nombre + ' ' + cita.paciente.usuario.apellido}">Nombre Paciente</h5>
                                    <p class="text-muted small mb-0" th:text="'DNI: ' + ${cita.paciente.usuario.dni}">DNI: 0000000</p>
                                </div>
                                <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2" th:if="${cita.estado.name() == 'CONFIRMADA'}">Confirmada</span>
                                <span class="badge bg-warning-subtle text-warning border border-warning-subtle rounded-pill px-3 py-2" th:if="${cita.estado.name() == 'PENDIENTE'}">Pendiente</span>
                                <span class="badge bg-info-subtle text-info border border-info-subtle rounded-pill px-3 py-2" th:if="${cita.estado.name() == 'COMPLETADA'}">Completada</span>
                                <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3 py-2" th:if="${cita.estado.name() == 'CANCELADA'}">Cancelada</span>
                            </div>
                            
                            <hr class="text-muted opacity-25">
                            
                            <div class="mb-4">
                                <p class="text-muted small mb-1 fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Motivo de Consulta</p>
                                <p class="mb-0" th:text="${cita.motivoConsulta ?: 'No especificado'}">Motivo...</p>
                            </div>
                            
                            <div class="mt-auto pt-4">
                                <a th:href="@{/panel-medico/consulta(citaId=${cita.id})}" class="btn-maroon d-block text-center text-decoration-none" style="border-radius: 8px;">
                                    <i class="fa-solid fa-stethoscope me-2"></i> 
                                    <span th:text="${cita.estado.name() == 'COMPLETADA' ? 'Ver Consulta' : 'Iniciar Consulta'}">Iniciar Consulta</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
