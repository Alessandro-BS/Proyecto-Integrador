<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/medico_base}">

<head>
    <title>Mi Disponibilidad y Horario</title>
    <style>
        .page-header {
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            color: #141d23;
            margin-bottom: 0.5rem;
        }

        /* Schedule Card */
        .schedule-card {
            background-color: var(--pure-white);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(107, 21, 21, 0.04);
            border: 1px solid #E5E5E5;
        }

        .card-header-title {
            font-size: 1.25rem;
            color: #4b0004;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        .schedule-row {
            display: flex;
            align-items: center;
            background-color: #fcfafa;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .schedule-row.disabled {
            background-color: #fbfbfb;
            border: 1px dashed #ddc0bd;
        }

        .day-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 0.9rem;
            margin-right: 1.5rem;
            flex-shrink: 0;
        }

        .day-badge.red {
            background-color: #fce8e6;
            color: #ba1a1a;
        }

        .day-badge.gray {
            background-color: #e9e9e9;
            color: #676462;
        }

        .day-badge.light-gray {
            background-color: #f0f0f0;
            color: #a09f9e;
        }

        .day-info {
            flex-grow: 1;
        }

        .day-name {
            font-size: 1rem;
            font-weight: 700;
            color: #141d23;
            margin-bottom: 0.15rem;
        }

        .day-turn {
            font-size: 0.8rem;
            color: #676462;
        }

        .time-blocks {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-end;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4b0004;
        }

        .time-blocks.disabled {
            color: #a09f9e;
            font-weight: 500;
            font-style: italic;
            font-size: 0.9rem;
        }

        .badge-closed {
            background-color: #e9e9e9;
            color: #676462;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Summary Card */
        .summary-card {
            background-color: #4b0004;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            color: var(--pure-white);
            height: 100%;
            box-shadow: 0 10px 30px rgba(75, 0, 4, 0.15);
        }

        .summary-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .summary-item {
            margin-bottom: 2rem;
        }

        .summary-item:last-child {
            margin-bottom: 0;
        }

        .summary-label {
            font-size: 0.9rem;
            color: #ffb3ad;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .summary-value {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            font-family: var(--font-headline);
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .summary-trend {
            font-size: 1rem;
            color: #28a745;
            font-weight: 700;
            font-family: var(--font-body);
        }

        /* Doctor Profile Card */
        .doctor-profile-card {
            background-color: var(--pure-white);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(107, 21, 21, 0.04);
            border: 1px solid #E5E5E5;
            margin-bottom: 2rem;
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .doctor-photo-container {
            position: relative;
            flex-shrink: 0;
        }

        .doctor-photo {
            width: 180px;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .photo-edit-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #4b0004;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .photo-edit-btn:hover {
            background-color: #6b1515;
        }

        .doctor-info-main {
            flex-grow: 1;
        }

        .doctor-specialty-tag {
            background-color: #fce8e6;
            color: #4b0004;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 0.75rem;
        }

        .doctor-name {
            font-size: 2.2rem;
            color: #4b0004;
            margin-bottom: 0.25rem;
            line-height: 1.2;
        }

        .doctor-codes {
            color: #676462;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .doctor-contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #141d23;
            font-size: 0.95rem;
        }

        .contact-item i {
            color: #6b1515;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .doctor-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-profile-primary {
            background-color: #4b0004;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-profile-primary:hover {
            background-color: #380003;
            color: white;
        }

        .btn-profile-secondary {
            background-color: transparent;
            color: #4b0004;
            border: 1px solid #4b0004;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-profile-secondary:hover {
            background-color: #fdf7f4;
            color: #4b0004;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">


        <!-- Doctor Profile Card (Top) -->
        <div class="doctor-profile-card">
            <div class="doctor-photo-container" style="position: relative;">
                <img th:if="${usuario != null && usuario.fotoPerfil != null}" th:src="${usuario.fotoPerfil}"
                    alt="Doctor Photo" class="doctor-photo">
                <img th:unless="${usuario != null && usuario.fotoPerfil != null}" th:src="${usuario != null} ? 'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '+' + ${usuario.apellido} + '&background=ffffff&color=4b0004' : 'https://ui-avatars.com/api/?name=Medico&background=ffffff&color=4b0004'"
                    alt="Doctor Photo" class="doctor-photo">
                    
                <form th:action="@{/panel-medico/perfil/foto}" method="POST" enctype="multipart/form-data" id="fotoForm" style="display: none;">
                    <input type="file" name="foto" id="fotoInput" accept="image/*" onchange="document.getElementById('fotoForm').submit()">
                </form>
                
                <button class="photo-edit-btn" title="Actualizar foto" onclick="document.getElementById('fotoInput').click()" style="position: absolute; bottom: 0; right: 0; background: #6b1515; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                    <i class="fa-solid fa-camera"></i>
                </button>
                
                <a th:if="${usuario != null && usuario.fotoPerfil != null}" th:href="@{/panel-medico/perfil/foto/eliminar}" class="photo-edit-btn" title="Eliminar foto" style="position: absolute; bottom: 0; left: 0; background: #dc3545; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); text-decoration: none;">
                    <i class="fa-solid fa-trash"></i>
                </a>
            </div>

            <div class="doctor-info-main">
                <div class="doctor-specialty-tag" th:text="${medico != null && medico.especialidades != null && !medico.especialidades.isEmpty() ? medico.especialidades.iterator().next().nombre : 'ESPECIALISTA'}">CARDIOLOGÍA CLÍNICA</div>
                <h2 class="doctor-name headline" th:text="${usuario != null ? 'Dr(a). ' + usuario.nombre + ' ' + usuario.apellido : 'Dr. Médico'}">Dr. Roberto Valdivia Mendoza</h2>
                <div class="doctor-codes" th:text="'CMP: ' + ${medico != null ? medico.numeroColegiatura : 'N/A'}">CMP: 058422</div>

                <div class="doctor-contact-grid">
                    <div class="contact-item">
                        <i class="fa-regular fa-envelope"></i> <span th:text="${usuario != null ? usuario.email : 'correo@sisolsalud.gob.pe'}">r.valdivia@sisolsalud.gob.pe</span>
                    </div>
                    <div class="contact-item">
                        <i class="fa-solid fa-phone"></i> <span th:text="${usuario != null ? usuario.telefono : 'N/A'}">+51 987 654 321</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">

            <!-- Columna Izquierda: Horario -->
            <div class="col-lg-7">
                <div class="schedule-card">
                    <h2 class="card-header-title headline">
                        <i class="fa-regular fa-clock"></i> Horario de Trabajo
                    </h2>

                    <!-- Horario dinámico -->
                    <div th:if="${disponibilidades == null || disponibilidades.isEmpty()}" class="schedule-row disabled">
                        <div class="day-badge light-gray"><i class="fa-solid fa-calendar-xmark"></i></div>
                        <div class="day-info">
                            <div class="day-name" style="color: #676462;">Sin Horario</div>
                            <div class="day-turn" style="color: #a09f9e;">No has configurado tu horario</div>
                        </div>
                        <div>
                            <span class="badge-closed">NO DISPONIBLE</span>
                        </div>
                    </div>

                    <div th:each="disp : ${disponibilidades}" th:class="'schedule-row ' + (${!disp.activo} ? 'disabled' : '')">
                        <div th:class="'day-badge ' + (${disp.activo} ? 'red' : 'light-gray')" 
                             th:text="${#strings.substring(disp.diaSemana.name(), 0, 1)}">L</div>
                        <div class="day-info">
                            <div class="day-name" th:text="${#strings.capitalize(#strings.toLowerCase(disp.diaSemana.name()))}">Lunes</div>
                            <div class="day-turn" th:text="'Cada ' + ${disp.duracionConsultaMin} + ' min'">Turno</div>
                        </div>
                        <div th:class="'time-blocks ' + (${!disp.activo} ? 'disabled' : '')">
                            <span th:if="${disp.activo}" th:text="${#temporals.format(disp.horaInicio, 'hh:mm a')} + ' - ' + ${#temporals.format(disp.horaFin, 'hh:mm a')}">08:00 AM - 01:00 PM</span>
                            <span th:unless="${disp.activo}" class="badge-closed">CERRADO</span>
                        </div>
                    </div>


                </div>
            </div>

            <!-- Columna Derecha: Resumen -->
            <div class="col-lg-5">
                <div class="summary-card">
                    <h2 class="summary-title headline">Resumen Mensual</h2>

                    <div class="summary-item">
                        <div class="summary-label">Pacientes Atendidos</div>
                        <div class="summary-value">
                            <span th:text="${pacientesAtendidosMes ?: 0}">148</span>
                        </div>
                    </div>

                    <div class="summary-item">
                        <div class="summary-label">Citas Pendientes</div>
                        <div class="summary-value" th:text="${citasPendientes ?: 0}">
                            24
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</body>

</html>
